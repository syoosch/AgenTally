name: Bug report / 错误报告
description: Report a reproducible AgenTally problem / 报告可复现的错误
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Please read [SUPPORT.md](https://github.com/syoosch/AgenTally/blob/main/SUPPORT.md) and search [existing issues](https://github.com/syoosch/AgenTally/issues) before submitting. Reports in English or Chinese are welcome.
        感谢反馈。提交前请先查看支持文档并搜索现有 Issues，可以使用英文或中文提交。

        Do not upload Prompts, responses, Agent source records, databases, credentials, complete local paths, or other private data.
        请勿上传 Prompt、回复、Agent 原始记录、数据库、凭据、完整本地路径或其他私人数据。

  - type: input
    id: version
    attributes:
      label: AgenTally version / AgenTally 版本
      description: Find it in Settings → About & Updates. / 可在“设置 → 关于与更新”中查看。
      placeholder: e.g. v0.1.0 / 例如 v0.1.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version / Windows 版本
      placeholder: e.g. Windows 11 24H2 x64
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation method / 安装方式
      options:
        - GitHub Release installer / GitHub Release 安装程序
        - Running from source / 从源码运行
        - Other or unsure / 其他或不确定
    validations:
      required: true

  - type: dropdown
    id: agents
    attributes:
      label: Affected Agent / 受影响的 Agent
      description: Select all that apply; choose “Not Agent-specific” when appropriate. / 可多选；如与采集无关请选择“与 Agent 无关”。
      multiple: true
      options:
        - Codex
        - Claude Code CLI
        - Claude Desktop Code
        - Kimi Code
        - Kimi Work
        - ZCode
        - WorkBuddy
        - Qwen Code
        - Qoder Desktop
        - Qoder CN Desktop
        - Qoder CLI
        - Gemini CLI
        - OpenCode
        - Not Agent-specific / 与 Agent 无关
    validations:
      required: true

  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility shown in Data Sources / “数据来源”显示的兼容状态
      description: Choose the status shown for the affected source. / 请选择受影响来源当前显示的状态。
      options:
        - Fully compatible / 完全兼容
        - Partially compatible / 部分兼容
        - Not currently compatible / 暂不兼容
        - Source not listed / 未列出该来源
        - Not Agent-specific / 与来源无关
        - Unsure / 不确定
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: Provide the shortest reproducible steps without pasting real records. / 请提供最短可复现步骤，不要粘贴真实记录。
      placeholder: |
        1. Open... / 打开……
        2. Select... / 选择……
        3. Observe... / 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
      description: You may include a short error message after removing personal data. / 可以提供已脱敏的简短错误提示。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional sanitized context / 其他脱敏信息
      description: Optional. Include only information directly relevant to the problem with personal data removed. / 可选，只提供与问题直接相关且已移除个人信息的内容。

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私确认
      options:
        - label: I confirm that this issue contains no Prompts, responses, tool contents, Agent source records, databases, credentials, cookies, login tokens, API keys, complete local paths, project names, session names, or other private data. / 我确认本 Issue 不含上述私人数据。
          required: true
    validations:
      required: true
